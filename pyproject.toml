[project]
name = "fidsus"
version = "0.1.0"
description = "FIDSUS: Federated Intrusion Detection for Securing UAV Swarms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FIDSUS Contributors" },
]
keywords = ["federated-learning", "intrusion-detection", "uav", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行时硬依赖：仅保留 system/ 运行时实际 import 的库（不含 torch，torch 走 optional）
#   numpy / h5py / scikit-learn
dependencies = [
    "numpy>=1.24,<3.0",
    "h5py>=3.8",
    "scikit-learn>=1.2",
]

# ---------------------------------------------------------------------------
# torch 多 CUDA 变体（互斥，二选一）。
#   - cu118 : Pascal 等老卡（sm_61 / compute_cap < 7.5），如 GT 1030。
#             PyTorch 2.7+ 的默认 CUDA 构建不再支持 sm_61，2.6.*+cu118 是
#             最后一个仍含 sm_61 二进制的稳定构建。
#   - cu126 : Turing 及更新（sm_75+ / compute_cap >= 7.5），如 RTX 40/50 系。
#             cu126 是 2025 年支持 sm_89（RTX 4090 等）最稳定的官方构建。
#   - cpu   : 无 GPU 环境（CI、纯 CPU 机器）。
#
# 选择方式（由 run_experiments.sh / run_gpu.bat 自动检测 GPU 决定）：
#   uv sync --extra cu118      # 老卡
#   uv sync --extra cu126      # 新卡（RTX 20/30/40/50 系）
#   uv sync --extra cpu        # 无 GPU
#
# 手动指定也可，但三选一（conflicts 保证互斥）。
# ---------------------------------------------------------------------------
[project.optional-dependencies]
cu118 = [
    "torch>=2.6,<2.7",
]
cu126 = [
    "torch>=2.6",
]
cpu = [
    "torch>=2.6",
]

[dependency-groups]
# 测试依赖（uv sync --group dev 或 uv run pytest）
dev = [
    "pytest>=8.0",
]
# 数据集生成工具的可选依赖（dataset/utils/dataset_utils.py 用 ujson）
dataset = [
    "ujson>=5.0",
]

[tool.uv]
# 三个 CUDA 变体互斥：同一环境只能装一种 torch。
conflicts = [
    [
        { extra = "cu118" },
        { extra = "cu126" },
        { extra = "cpu" },
    ],
]

# torch 按 extra 路由到不同索引；cu118→cu118 索引，cu126→cu126 索引，
# cpu→PyPI（默认 CPU wheel）。
[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", extra = "cu118" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # 忽略项目自身的已知 deprecation 噪声（torch softmax 无 dim 参数等）
    "ignore::UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system"]
