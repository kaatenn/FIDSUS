[project]
name = "fidsus"
version = "0.1.0"
description = "FIDSUS: Federated Intrusion Detection for Securing UAV Swarms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "FIDSUS Contributors" },
]
keywords = ["federated-learning", "intrusion-detection", "uav", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 运行时硬依赖：仅保留 system/ 运行时实际 import 的库
#   torch / numpy / h5py / scikit-learn
#
# torch 版本说明（重要）：
#   本机 GPU 为 NVIDIA GT 1030（Pascal 架构, compute capability sm_61）。
#   PyTorch 2.7+ 的默认 CUDA 构建已不再支持 sm_61（最低要求 sm_75）。
#   最后一个仍含 sm_61 的 cu118 构建是 PyTorch 2.6.x，故此处锁定 2.6.*
#   并通过下方 [[tool.uv.index]] 指向 cu118 索引。
#   若改用更新的 GPU（sm_75+），可放宽为 "torch>=2.6" 并切换到 cu126/cu128 索引。
dependencies = [
    "torch>=2.6,<2.7",
    "numpy>=1.24,<3.0",
    "h5py>=3.8",
    "scikit-learn>=1.2",
]

[dependency-groups]
# 测试依赖（uv run pytest）
dev = [
    "pytest>=8.0",
]
# 数据集生成工具的可选依赖
#   dataset/utils/dataset_utils.py 使用 ujson；
#   仅在重新分区数据集时需要，不影响 system/ 运行。
dataset = [
    "ujson>=5.0",
]

[tool.uv]
# torch 走 PyTorch 官方 cu118 索引（含 sm_61/Pascal 支持）。
# 非依赖（无主键）包从这里取，其余依赖仍走 PyPI。

# PyTorch CUDA 11.8 索引：本地 GPU (GT 1030, sm_61) 必需
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

# 若需回退到 CPU 版 torch（例如在无 GPU 的机器上），
# 注释掉上面 [tool.uv.sources] 与 [[tool.uv.index]] 两段，并把 dependencies 里改为
# "torch>=2.6"（CPU wheel 默认来自 PyPI）。

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = [
    # 忽略项目自身的已知 deprecation 噪声（torch softmax 无 dim 参数等）
    "ignore::UserWarning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system"]
